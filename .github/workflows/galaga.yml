name: Generate Galaga Contribution Game

on:
  schedule:
    - cron: "0 */24 * * *" # Berjalan otomatis setiap 24 jam
  workflow_dispatch: # Memungkinkan kita klik "Run workflow" secara manual
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate Galaga graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          game: 'galaga'
          
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
